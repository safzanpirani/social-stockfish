<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>social stockfish</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                padding: 10px;
            }

            .suggestion {
                margin: 10px 0;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            .context {
                margin: 10px 0;
                padding: 10px;
                background-color: #f5f5f5;
                border-radius: 4px;
            }

            .probability {
                font-weight: bold;
                color: #2196f3;
            }

            .reasoning {
                font-style: italic;
                color: #666;
                margin-top: 5px;
            }

            /* Loading indicator styles */
            .loading {
                display: none;
                margin: 20px 0;
                text-align: center;
            }

            .loading-spinner {
                width: 50px;
                height: 50px;
                border: 5px solid #f3f3f3;
                border-top: 5px solid #2196f3;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 10px;
            }

            .loading-text {
                color: #666;
                font-size: 14px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            /* Button styles */
            #clickMe {
                background-color: #2196f3;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 4px;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            #clickMe:hover {
                background-color: #1976d2;
            }

            #clickMe:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }

            /* Toggle switch styles */
            .switch {
                position: relative;
                display: inline-block;
                width: 60px;
                height: 34px;
            }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #ccc;
                transition: .4s;
                border-radius: 34px;
            }

            .slider:before {
                position: absolute;
                content: "";
                height: 26px;
                width: 26px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                transition: .4s;
                border-radius: 50%;
            }

            input:checked + .slider {
                background-color: #ff69b4;
            }

            input:focus + .slider {
                box-shadow: 0 0 1px #ff69b4;
            }

            input:checked + .slider:before {
                transform: translateX(26px);
            }
        </style>
    </head>

    <body style="width: 400px">
        <h1>social stockfish</h1>
        <div style="margin-bottom: 15px">
            <label for="chatGoal"
                >what would you like to achieve in this chat?</label
            >
            <textarea
                id="chatGoal"
                rows="3"
                style="width: 100%; margin-top: 5px; padding: 5px"
                placeholder="e.g., understand their perspective, plan a romantic date, resolve a misunderstanding..."
            ></textarea>
        </div>
        
        <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
            <button id="clickMe">delve</button>
            <div style="display: flex; align-items: center;">
                <label for="romanceMode" style="margin-right: 10px;">romantic</label>
                <label class="switch">
                    <input type="checkbox" id="romanceMode">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">analyzing conversation...</div>
        </div>

        <div id="analysis-context" class="context"></div>
        <div id="suggestions"></div>
        <!-- Make sure the script is loaded after the dom content -->
        <script src="popup.js" type="module"></script>
    </body>
</html>
